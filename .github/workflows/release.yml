name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle test jar
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/libs/*.jar'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" build/libs/*.jar --generate-notes --verify-tag
      - name: Import signing key
        if: env.SIGNING_KEY != ''
        run: printf '%s' "$SIGNING_KEY" | gpg --batch --import
      # Maven Central (plugin jar + plugin marker) via the Central Portal OSSRH staging API, then the
      # manual-upload POST that publishes it. The Gradle Plugin Portal needs an API key we do not have.
      - run: gradle publish
        continue-on-error: true # a re-run of a tag hits 409 here; Maven Central is the real target
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != '' && env.SIGNING_KEY != ''
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -fsI "https://repo1.maven.org/maven2/io/github/watchtowerobservability/watchtower-gradle-plugin/$V/" >/dev/null; then
            echo "watchtower-gradle-plugin $V is already on Maven Central"; exit 0
          fi
          gradle publishAllPublicationsToMavenCentralRepository
          AUTH=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          curl -fS -X POST -H "Authorization: Bearer $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.watchtowerobservability?publishing_type=automatic"
